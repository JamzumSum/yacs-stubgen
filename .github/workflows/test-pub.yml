name: Test, Build and Publish

on:
  push:
    paths:
      - "src/**"
      - "uv.lock"
      - ".github/workflows/test-pub.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
      - name: Install and Test
        run: |
          echo "::group::Install Basic Dependencies"
          uv sync --no-default-groups --group test
          echo "::endgroup::"

          echo "::group::pytest outputs"
          uv run pytest tests --log-cli-level=WARNING
          echo "::endgroup::"

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install Poetry and Publish to PyPI
        id: publish
        env:
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "version=$(uv version --short)" >> $GITHUB_OUTPUT
          uv build --no-sources
          uv publish --username __token__
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ startsWith(github.head_ref, 'dev') }}
          tag_name: ${{ steps.publish.outputs.version }}
          name: ${{ steps.publish.outputs.version }}
          generate_release_notes: true
